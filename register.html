<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN-FORM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        
        <form action="">
            <h3>REGISTER HERE</h3>
            <label for="">Username</label>
            <input id="email" type="email" placeholder="Email or Phone" required>
            <label for="">Password</label>
            <input id="password" type="password" placeholder="Password" required>
            <button id="submit" type="submit" class="login">SIGNUP</button>
            <div class="social">
            Have an Account? <a href="/index.html">Login Here</a>
            </div>
        </form>
    </div>
    <script type="module" src="/register.js" defer></script>
</body>
</html>
